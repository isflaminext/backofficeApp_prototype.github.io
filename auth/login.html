<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Web Apps - Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #2ec0cc, #0072ff);
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        background-image: url("../../../assets/undraw_predictive-analytics_6gsu.svg");
        background-repeat: repeat;
        background-position: center;
        background-size: contain;
        opacity: 0.12;
        transform: translate(-50%, -50%);
        z-index: 0;
      }

      .login-container {
        position: relative;
        background: #fff;
        width: 400px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        padding: 1.5rem;
        text-align: center;
        transition: all 0.3s ease;
        z-index: 1;
      }

      .login-container:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      }

      .logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 1rem;
        border: 3px solid #0072ff;
      }

      .logo img {
        width: 45px;
        height: 45px;
        border-radius: 50%;
      }

      h2 {
        font-weight: 700;
        color: #333;
        margin-bottom: 0.4rem;
      }

      p.subtitle {
        color: #6b7280;
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }

      .input-group {
        text-align: left;
        margin-bottom: 1rem;
      }

      .input-group label {
        display: block;
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.3rem;
        font-size: 0.9rem;
      }

      .input-group input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 0.95rem;
        transition: all 0.2s ease;
      }

      .input-group input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      }

      .forgot {
        text-align: right;
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
      }

      .forgot a {
        color: #3b82f6;
        text-decoration: none;
      }

      .forgot a:hover {
        text-decoration: underline;
      }

      .btn-primary {
        width: 100%;
        background: #2563eb;
        color: white;
        font-weight: 600;
        padding: 0.75rem;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      .btn-primary:hover {
        background: #1d4ed8;
      }

      .divider {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 1.5rem 0;
        color: #9ca3af;
        font-size: 0.9rem;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e5e7eb;
        margin: 0 10px;
      }

      .btn-google {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 0.75rem;
        background: #fff;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-weight: 600;
        color: #374151;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-google:hover {
        background: #f9fafb;
      }

      .btn-google img {
        width: 20px;
        height: 20px;
      }

      footer {
        text-align: center;
        margin-top: 2rem;
        font-size: 0.85rem;
        color: #6b7280;
      }

      footer a {
        color: #2563eb;
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .login-container {
          width: 90%;
          padding: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="logo">
        <img src="../../../assets/advanta.png" alt="logo" />
      </div>
      <h2>Welcome Back!</h2>
      <p class="subtitle">Sign in to continue to your dashboard</p>

      <form
        action="#"
        method="POST"
        onsubmit="event.preventDefault(); window.location.href='../index.html';"
      >
        <div class="input-group">
          <label>Username</label>
          <input type="text" placeholder="Enter your username" required />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" placeholder="Enter your password" required />
        </div>

        <div class="forgot">
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <div class="divider">or continue with</div>

      <button class="btn-google">
        <img
          src="https://cdn-icons-png.flaticon.com/512/281/281764.png"
          alt="Google"
        />
        Sign in with Google
      </button>
    </div>
  </body>
</html>
